name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-build:
    name: Build & Verify iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Kotlin/common metadata
        run: ./gradlew :shared:compileCommonMainKotlinMetadata --no-daemon

      - name: Build Kotlin framework for iOS Simulator (arm64)
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
          mkdir -p shared/build/xcode-frameworks/Debug/iphonesimulator
          cp -Rf shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework \
              shared/build/xcode-frameworks/Debug/iphonesimulator/
          echo "Framework built:"
          ls shared/build/xcode-frameworks/Debug/iphonesimulator/

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -E "iPhone [0-9]" | head -10

      - name: Build iOS app (Simulator, arm64, no signing)
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E "    iPhone [0-9]" | tail -1 | sed -E 's/^ +//' | sed 's/ (.*//')
          echo "Using simulator: $SIM_NAME"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIM_NAME,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          grep -E "BUILD SUCCEEDED|BUILD FAILED|^.*error:" "$RUNNER_TEMP/xcodebuild.log" | grep -v "export " | tail -15

      - name: Check build output
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "iosApp.app" -type d | head -1)
          if [ -n "$APP" ]; then
            echo "Build SUCCESS: $APP"
            ls -lh "$APP"
          else
            echo "Build FAILED: iosApp.app not found"
            exit 1
          fi

      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "    iPhone [0-9]+ \(" | tail -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found, listing what's available:"
            xcrun simctl list devices available | grep iPhone
            exit 1
          fi
          echo "Simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Install app on simulator
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "iosApp.app" -type d | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          echo "Installed: $APP"

      - name: Launch app on simulator (smoke test)
        run: |
          xcrun simctl launch "$SIM_UDID" kz.gov.dari.dermek
          sleep 8
          echo "App launched — taking screenshot"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/simulator-screenshot.png"

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/simulator-screenshot.png

      - name: Run shared Kotlin tests (iOS target)
        run: |
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon || true

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$SIM_UDID" || true
