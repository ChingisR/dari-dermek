name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-build:
    name: Build & Verify iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Kotlin/common metadata
        run: ./gradlew :shared:compileCommonMainKotlinMetadata --no-daemon

      - name: Compile Kotlin iOS Simulator framework
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -E "iPhone [0-9]" | head -10

      - name: Build iOS app (Simulator, no signing)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build | xcpretty || true

      - name: Check build output
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "iosApp.app" -type d | head -1)
          if [ -n "$APP" ]; then
            echo "Build SUCCESS: $APP"
            ls -lh "$APP"
          else
            echo "Build FAILED: iosApp.app not found"
            exit 1
          fi

      - name: Boot iPhone 15 simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -1 | sed 's/.*(\([A-Z0-9-]*\)).*/\1/')
          echo "Simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Install app on simulator
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "iosApp.app" -type d | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          echo "Installed $APP"

      - name: Launch app on simulator (smoke test)
        run: |
          xcrun simctl launch "$SIM_UDID" kz.gov.dari.dermek
          sleep 8
          echo "App launched — taking screenshot"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/simulator-screenshot.png"

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/simulator-screenshot.png

      - name: Run shared Kotlin tests (iOS target)
        run: |
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon || true

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$SIM_UDID" || true
