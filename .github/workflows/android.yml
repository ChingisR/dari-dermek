name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile shared common metadata
        run: ./gradlew :shared:compileCommonMainKotlinMetadata --no-daemon

      - name: Decode keystore (if secret available)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/dari-dermek-release.jks

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dari-dermek-debug.apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Build release AAB (Google Play)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          STOREFILE: dari-dermek-release.jks
          STOREPASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease --no-daemon

      - name: Upload release AAB artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dari-dermek-release.aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
